<style>
  :root {
    /* --- Palette brand Wibo --- */
    --wibo-violet:   #6452D9;  /* Primary */
    --medium-violet: #A197E7;
    --light-violet:  #DAD7F0;
    --mint:          #2BD988;  /* Secondary */
    --lemon:         #FFF68A;
    --orange:        #FFA109;
    --black:         #1E1C1C;  /* Essential */
    --dark-grey:     #525959;
    --medium-grey:   #9DA8A7;
    --grey:          #C7D1D0;
    --super-light:   #F2F2F2;
    --white:         #FFFFFF;

    /* --- Token semantici (tema chiaro, tutti derivati dal brandbook) --- */
    --page:       #F2F2F2;  /* Super Light grey: sfondo */
    --surface:    #FFFFFF;  /* White: pannelli/card */
    --brand:      #6452D9;  /* Wibo Violet: colore guida */
    --brand-soft: #A197E7;  /* Medium Violet: bordi/accenti */
    --brand-wash: #DAD7F0;  /* Light Violet: riempimenti tenui */
    --hairline:   #C7D1D0;  /* Grey: bordi neutri */

    /* --- Medaglie (oro/argento/bronzo; argento e bronzo agganciati al brand) --- */
    --gold:     #FFD24A;
    --gold-2:   #F0B400;
    --silver:   #E4E8EC;
    --silver-2: #9DA8A7;   /* Medium grey */
    --bronze:   #E0863C;
    --bronze-2: #A85D22;

    --text:     #1E1C1C;   /* Black: testo/titoli primari */
    --text-dim: #525959;   /* Dark grey: testo secondario */
    --text-muted: #9DA8A7; /* Medium grey: etichette attenuate */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: var(--page);
    color: var(--text);
    font-family: 'Lato', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    background:
      radial-gradient(1100px 680px at 50% -14%, rgba(161,151,231,0.38), transparent 62%),
      radial-gradient(820px 560px at 10% 114%, rgba(100,82,217,0.10), transparent 60%),
      radial-gradient(820px 560px at 90% 114%, rgba(255,161,9,0.07), transparent 60%),
      linear-gradient(180deg, var(--surface), var(--page) 60%);
    background-attachment: fixed;
  }

  /* Titoli: Roboto Slab Medium (500) come da brandbook */
  h1, h2, h3, .slab {
    font-family: 'Roboto Slab', Georgia, serif;
    font-weight: 500;
  }

  /* ---------- Layout scaffolding ---------- */
  .screen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: clamp(20px, 4vh, 60px);
    text-align: center;
  }
  .hidden { display: none !important; }
  /* Setup: scrollabile e allineato in alto (5 posizioni possono superare l'altezza schermo) */
  #setup.screen {
    justify-content: flex-start;
    overflow-y: auto;
    padding-top: clamp(58px, 9vh, 96px);
    padding-bottom: clamp(24px, 4vh, 48px);
  }
  #setup .panel { margin: auto; }

  .eyebrow {
    position: fixed;
    top: clamp(16px, 3vh, 34px);
    left: 50%;
    transform: translateX(-50%);
    letter-spacing: 0.42em;
    font-size: clamp(11px, 1.4vw, 16px);
    font-weight: 700;
    color: var(--text-dim);
    text-transform: uppercase;
    z-index: 30;
    white-space: nowrap;
  }
  .eyebrow b { color: var(--brand); font-weight: 900; }

  .wordmark {
    font-family: 'Roboto Slab', serif;
    font-weight: 500;
    letter-spacing: -0.02em;
    color: var(--brand);
    line-height: 0.9;
  }
  /* Logo wibo ufficiale (PNG trasparente incorporato) */
  .logo-img {
    display: block;
    height: 1em;
    width: auto;
    margin: 0 auto;
  }

  /* ---------- Setup screen ---------- */
  #setup .panel {
    width: min(680px, 92vw);
    background: var(--surface);
    border: 1px solid var(--brand-wash);
    border-radius: 26px;
    padding: clamp(26px, 4vh, 48px);
    box-shadow: 0 24px 70px rgba(100,82,217,0.16), 0 4px 14px rgba(30,28,28,0.06);
  }
  #setup .logo-big {
    font-size: clamp(38px, 6vw, 76px);
    margin: clamp(4px, 1vh, 12px) auto clamp(16px, 2.6vh, 28px);
  }
  #setup .subtitle {
    color: var(--text-dim);
    font-size: clamp(15px, 2vw, 20px);
    margin-bottom: clamp(16px, 3vh, 28px);
    font-weight: 400;
    letter-spacing: 0.04em;
  }
  .field { margin-bottom: 15px; text-align: left; }
  .field label {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: 'Roboto Slab', serif;
    font-weight: 500;
    font-size: clamp(16px, 2vw, 21px);
    margin-bottom: 10px;
  }
  .rank-chip {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px; height: 40px;
    border-radius: 50%;
    font-family: 'Roboto Slab', serif;
    font-weight: 500;
    font-size: 18px;
    color: var(--black);
    box-shadow: 0 6px 16px rgba(0,0,0,0.4);
    flex: none;
  }
  .chip-1 { background: linear-gradient(145deg, var(--gold), var(--gold-2)); }
  .chip-2 { background: linear-gradient(145deg, var(--white), var(--silver-2)); }
  .chip-3 { background: linear-gradient(145deg, var(--bronze), var(--bronze-2)); color: var(--white); }
  .chip-loser { background: var(--grey); color: var(--dark-grey); }
  .fuori-label {
    text-align: center;
    color: var(--text-muted);
    font-family: 'Roboto Slab', serif;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-size: clamp(11px, 1.4vw, 14px);
    margin: 6px 0 16px;
  }

  select {
    width: 100%;
    padding: 15px 18px;
    font-size: clamp(15px, 1.9vw, 19px);
    font-family: 'Lato', sans-serif;
    font-weight: 700;
    color: var(--text);
    background: var(--surface);
    border: 1.5px solid var(--brand-soft);
    border-radius: 14px;
    appearance: none;
    cursor: pointer;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' fill='none' stroke='%236452D9' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat: no-repeat;
    background-position: right 16px center;
    transition: border-color .2s, box-shadow .2s;
  }
  select:hover { border-color: var(--brand); }
  select:focus {
    outline: none;
    border-color: var(--brand);
    box-shadow: 0 0 0 4px rgba(100,82,217,0.20);
  }
  select option { background: var(--surface); color: var(--text); }

  .warn {
    color: var(--orange);
    font-weight: 700;
    font-size: 14px;
    min-height: 20px;
    margin: 4px 0 14px;
    text-align: center;
    letter-spacing: 0.02em;
  }

  .btn {
    font-family: 'Roboto Slab', serif;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border: none;
    cursor: pointer;
    color: var(--white);
    border-radius: 16px;
    transition: transform .15s ease, box-shadow .2s ease, filter .2s;
  }
  .btn:active { transform: translateY(1px) scale(0.99); }
  .btn-primary {
    width: 100%;
    padding: 18px;
    font-size: clamp(17px, 2.2vw, 22px);
    background: var(--brand);
    box-shadow: 0 14px 32px rgba(100,82,217,0.32), inset 0 1px 0 rgba(255,255,255,0.22);
  }
  .btn-primary:hover { filter: brightness(1.07); box-shadow: 0 18px 44px rgba(100,82,217,0.42); }

  .setup-hint {
    margin-top: 18px;
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 0.03em;
  }
  .setup-hint kbd {
    background: var(--brand-wash);
    border: 1px solid var(--brand-soft);
    border-radius: 6px;
    padding: 2px 8px;
    font-family: 'Lato', monospace;
    font-size: 12px;
    color: var(--brand);
  }

  /* ---------- Stage (show) ---------- */
  #stage { justify-content: center; }
  .stage-inner {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .announce {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(14px, 3vh, 30px);
  }
  .announce .medal-ring {
    width: clamp(120px, 18vh, 200px);
    height: clamp(120px, 18vh, 200px);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Roboto Slab', serif;
    font-weight: 500;
    font-size: clamp(52px, 9vh, 104px);
    position: relative;
  }
  .announce .rank-label {
    font-family: 'Roboto Slab', serif;
    font-weight: 500;
    font-size: clamp(38px, 8vw, 96px);
    letter-spacing: 0.02em;
    line-height: 1.02;
  }
  .announce .rank-sub {
    color: var(--text-muted);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    font-size: clamp(12px, 1.8vw, 18px);
    font-weight: 700;
  }

  .prompt-advance {
    position: fixed;
    bottom: clamp(26px, 6vh, 64px);
    left: 50%;
    transform: translateX(-50%);
    color: var(--text-dim);
    font-size: clamp(13px, 1.6vw, 18px);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-weight: 700;
    animation: pulseHint 1.8s ease-in-out infinite;
    z-index: 25;
  }
  .prompt-advance kbd {
    background: var(--brand-wash);
    border: 1px solid var(--brand-soft);
    border-radius: 7px;
    padding: 3px 10px;
    color: var(--brand);
    font-family: inherit;
  }
  @keyframes pulseHint { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }

  /* Reveal card */
  .reveal-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(10px, 2vh, 22px);
    max-width: min(1100px, 94vw);
  }
  .reveal-medal {
    width: clamp(110px, 17vh, 190px);
    height: clamp(110px, 17vh, 190px);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Roboto Slab', serif;
    font-weight: 500;
    color: var(--black);
    position: relative;
    box-shadow: 0 16px 40px rgba(30,28,28,0.20), inset 0 3px 10px rgba(255,255,255,0.55), inset 0 -6px 14px rgba(0,0,0,0.18);
  }
  .reveal-medal .pos-num { font-size: clamp(56px, 11vh, 120px); line-height: 1; }
  .reveal-medal .pos-deg { font-size: 0.5em; vertical-align: super; }

  .medal-gold   { background: radial-gradient(circle at 35% 30%, #fff2b0, var(--gold) 45%, var(--gold-2) 90%); }
  .medal-silver { background: radial-gradient(circle at 35% 30%, var(--white), var(--silver) 45%, var(--silver-2) 92%); }
  .medal-bronze { background: radial-gradient(circle at 35% 30%, #ffd9a8, var(--bronze) 45%, var(--bronze-2) 90%); color: var(--white); }

  .reveal-table {
    font-family: 'Roboto Slab', serif;
    font-weight: 500;
    font-size: clamp(15px, 2.2vw, 26px);
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--brand);
  }
  .reveal-challenge {
    font-family: 'Roboto Slab', serif;
    font-weight: 500;
    font-size: clamp(34px, 6.5vw, 84px);
    line-height: 1.05;
    letter-spacing: -0.005em;
    color: var(--text);
    text-wrap: balance;
  }
  .reveal-members {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: clamp(10px, 1.6vw, 22px);
    margin-top: clamp(6px, 1.5vh, 16px);
  }
  .member {
    background: var(--brand-wash);
    border: 1px solid var(--brand-soft);
    border-radius: 999px;
    padding: clamp(9px, 1.4vh, 15px) clamp(16px, 2.2vw, 30px);
    font-size: clamp(15px, 2vw, 25px);
    font-weight: 700;
    letter-spacing: 0.01em;
    color: var(--text);
  }
  .member .dot {
    display:inline-block; width:9px; height:9px; border-radius:50%;
    margin-right:10px; vertical-align: middle;
    background: var(--orange);
    box-shadow: 0 0 10px var(--orange);
  }

  /* Momento clou 1° posto: unico titolo con gradiente oro */
  .gold-text,
  .reveal-card.first .reveal-challenge {
    background: linear-gradient(100deg, var(--gold-2), var(--gold) 48%, var(--orange));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .reveal-card.first .reveal-challenge { font-size: clamp(40px, 7.5vw, 104px); }
  .reveal-card.first .reveal-medal {
    width: clamp(130px, 20vh, 230px);
    height: clamp(130px, 20vh, 230px);
  }
  .reveal-card.first .crown {
    position: absolute;
    top: -0.55em;
    font-size: clamp(40px, 7vh, 78px);
    filter: drop-shadow(0 4px 10px rgba(0,0,0,.5));
    animation: crownFloat 2.4s ease-in-out infinite;
  }
  @keyframes crownFloat {
    0%,100% { transform: translateY(0) rotate(-4deg); }
    50% { transform: translateY(-8px) rotate(4deg); }
  }

  /* Drumroll */
  .drumroll {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(18px, 4vh, 40px);
  }
  .drumroll .dr-text {
    font-family: 'Roboto Slab', serif;
    font-weight: 500;
    font-size: clamp(34px, 6.5vw, 82px);
    letter-spacing: 0.01em;
    line-height: 1.06;
    text-wrap: balance;
    color: var(--text);
  }
  .dr-text.accent-text, .accent-text { color: var(--brand); }
  .dr-text.dr-strong { animation: drShake 0.35s ease-in-out infinite; }
  .dr-text.dr-soft   { animation: drSoft 1.4s ease-in-out infinite; }
  @keyframes drShake {
    0%,100% { transform: translate(0,0); }
    25% { transform: translate(-2px, 1px); }
    50% { transform: translate(2px, -1px); }
    75% { transform: translate(-1px, -1px); }
  }
  @keyframes drSoft {
    0%,100% { transform: scale(0.99); opacity: 0.86; }
    50% { transform: scale(1.012); opacity: 1; }
  }
  .dr-dots { display: flex; gap: 18px; }
  .dr-dots span {
    width: clamp(16px, 2.4vh, 26px);
    height: clamp(16px, 2.4vh, 26px);
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 24px var(--gold);
    animation: drPulse 0.9s ease-in-out infinite;
  }
  .dr-dots.gold span   { background: var(--gold);     box-shadow: 0 0 24px var(--gold); }
  .dr-dots.silver span { background: var(--silver-2); box-shadow: 0 0 20px rgba(157,168,167,0.7); }
  .dr-dots.bronze span { background: var(--bronze);   box-shadow: 0 0 20px rgba(224,134,60,0.7); }
  .dr-dots span:nth-child(2){ animation-delay: 0.15s; }
  .dr-dots span:nth-child(3){ animation-delay: 0.3s; }
  .dr-dots span:nth-child(4){ animation-delay: 0.45s; }
  @keyframes drPulse {
    0%,100% { transform: scale(0.6); opacity: 0.4; }
    50% { transform: scale(1.25); opacity: 1; }
  }
  /* Rullo di tamburi: vignette VIOLA che cresce (non nera), on-brand su fondo chiaro */
  #darkVeil {
    position: fixed; inset: 0;
    background: radial-gradient(circle at 50% 45%, transparent 28%, rgba(100,82,217,0.58) 100%);
    opacity: 0;
    pointer-events: none;
    z-index: 15;
  }

  /* ---------- Intro / avvio premiazione ---------- */
  .intro {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(14px, 3vh, 30px);
  }
  .intro-logo {
    height: clamp(70px, 13vh, 150px);
    width: auto;
    filter: drop-shadow(0 10px 26px rgba(100,82,217,0.22));
  }
  .intro-title {
    font-family: 'Roboto Slab', serif;
    font-weight: 500;
    font-size: clamp(34px, 6vw, 78px);
    line-height: 1.04;
    color: var(--text);
    text-wrap: balance;
  }
  .intro-sub {
    color: var(--brand);
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-size: clamp(13px, 1.9vw, 20px);
  }

  /* ---------- Loser card (4°/5°, mood pollici in giù) ---------- */
  .loser-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(8px, 1.6vh, 18px);
    max-width: min(1000px, 92vw);
    filter: saturate(0.55);
  }
  .loser-eyebrow {
    font-family: 'Roboto Slab', serif;
    font-weight: 500;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-size: clamp(13px, 1.8vw, 20px);
  }
  .loser-medal {
    font-size: clamp(72px, 15vh, 150px);
    line-height: 1;
    filter: grayscale(0.2) drop-shadow(0 6px 14px rgba(30,28,28,0.15));
    transform: rotate(-6deg);
  }
  .loser-rank {
    font-family: 'Roboto Slab', serif;
    font-weight: 500;
    font-size: clamp(15px, 2.2vw, 26px);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--dark-grey);
  }
  .loser-challenge {
    font-family: 'Roboto Slab', serif;
    font-weight: 500;
    font-size: clamp(28px, 5vw, 62px);
    line-height: 1.05;
    color: var(--medium-grey);
    text-wrap: balance;
  }
  .loser-card .member {
    background: rgba(157,168,167,0.16);
    border-color: var(--medium-grey);
    color: var(--dark-grey);
  }
  .loser-card .member .dot { background: var(--medium-grey); box-shadow: none; }
  .loser-quip {
    margin-top: clamp(4px, 1vh, 10px);
    font-style: italic;
    color: var(--text-muted);
    font-size: clamp(16px, 2.2vw, 26px);
    font-weight: 700;
  }

  /* ---------- Prize card ---------- */
  .prize-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(8px, 1.8vh, 18px);
    max-width: min(1000px, 92vw);
  }
  .prize-eyebrow {
    font-family: 'Roboto Slab', serif;
    font-weight: 500;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--brand);
    font-size: clamp(14px, 2vw, 24px);
  }
  .prize-icon {
    font-size: clamp(64px, 13vh, 148px);
    line-height: 1;
    filter: drop-shadow(0 8px 20px rgba(30,28,28,0.18));
  }
  .prize-label {
    color: var(--text-muted);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    font-weight: 700;
    font-size: clamp(12px, 1.6vw, 18px);
  }
  .prize-title {
    font-family: 'Roboto Slab', serif;
    font-weight: 500;
    color: var(--text);
    font-size: clamp(30px, 5.5vw, 72px);
    line-height: 1.06;
    letter-spacing: -0.005em;
    text-wrap: balance;
  }
  .prize-card.first .prize-title {
    font-size: clamp(34px, 6vw, 84px);
    background: linear-gradient(100deg, var(--gold-2), var(--gold) 48%, var(--orange));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .prize-detail {
    color: var(--text-dim);
    font-size: clamp(16px, 2.2vw, 28px);
    font-weight: 400;
    text-wrap: balance;
    max-width: 24ch;
  }

  /* Podium (side summary) */
  #podium {
    position: fixed;
    right: clamp(14px, 2vw, 40px);
    bottom: clamp(14px, 2.5vh, 40px);
    display: flex;
    align-items: flex-end;
    gap: clamp(8px, 1vw, 16px);
    z-index: 20;
    pointer-events: none;
  }
  .podium-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: clamp(76px, 8vw, 118px);
    opacity: 0;
    transform: translateY(14px);
    transition: opacity .5s ease, transform .5s ease;
  }
  .podium-col.show { opacity: 1; transform: translateY(0); }
  .podium-badge {
    width: clamp(30px, 3.2vw, 44px);
    height: clamp(30px, 3.2vw, 44px);
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    font-family: 'Roboto Slab', serif; font-weight: 500;
    font-size: clamp(14px, 1.6vw, 20px);
    color: var(--black);
    margin-bottom: 6px;
    box-shadow: 0 5px 14px rgba(30,28,28,0.20);
  }
  .podium-name {
    font-family: 'Roboto Slab', serif;
    font-weight: 500;
    font-size: clamp(10px, 1.1vw, 14px);
    color: var(--text);
    text-align:center;
    line-height:1.1;
    margin-bottom: 6px;
    letter-spacing: 0.02em;
  }
  .podium-bar {
    width: 100%;
    border-radius: 10px 10px 0 0;
    background: linear-gradient(180deg, var(--brand-soft), rgba(100,82,217,0.3));
    border: 1px solid var(--brand-soft);
    border-bottom: none;
    box-shadow: 0 6px 16px rgba(30,28,28,0.10);
  }
  .podium-col[data-pos="1"] .podium-bar { height: clamp(70px, 12vh, 130px); background: linear-gradient(180deg, var(--gold), rgba(240,180,0,0.35)); }
  .podium-col[data-pos="2"] .podium-bar { height: clamp(50px, 9vh, 96px);  background: linear-gradient(180deg, var(--silver), rgba(157,168,167,0.35)); }
  .podium-col[data-pos="3"] .podium-bar { height: clamp(36px, 6.5vh, 70px); background: linear-gradient(180deg, var(--bronze), rgba(168,93,34,0.35)); }
  .badge-1 { background: linear-gradient(145deg, var(--gold), var(--gold-2)); }
  .badge-2 { background: linear-gradient(145deg, var(--white), var(--silver-2)); }
  .badge-3 { background: linear-gradient(145deg, var(--bronze), var(--bronze-2)); color: var(--white); }

  /* Finale banner */
  #finale {
    position: fixed; inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 22;
    pointer-events: none;
  }
  #finale.show { display: flex; }
  #finale .fin-text {
    font-family: 'Roboto Slab', serif;
    font-weight: 500;
    font-size: clamp(22px, 3.6vw, 46px);
    color: var(--brand);
    letter-spacing: 0.06em;
    text-shadow: 0 2px 10px rgba(100,82,217,0.18);
    opacity: 0;
    animation: finIn 1s ease forwards;
  }
  @keyframes finIn { to { opacity: 1; transform: translateY(0);} from { opacity:0; transform: translateY(20px);} }

  /* ---------- Controls (top-right) ---------- */
  .controls {
    position: fixed;
    top: clamp(12px, 2vh, 22px);
    right: clamp(12px, 2vw, 24px);
    display: flex;
    gap: 10px;
    z-index: 40;
  }
  .btn-ghost {
    background: var(--surface);
    border: 1px solid var(--brand-soft);
    color: var(--text-dim);
    padding: 9px 15px;
    font-size: 12px;
    border-radius: 11px;
    letter-spacing: 0.08em;
    box-shadow: 0 2px 8px rgba(30,28,28,0.06);
  }
  .btn-ghost:hover { color: var(--surface); background: var(--brand); border-color: var(--brand); }

  /* ---------- Entrance animations ---------- */
  .anim-in > * { opacity: 0; }
  .anim-in.play > * { animation: elemIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  .anim-in.play > *:nth-child(1) { animation-delay: 0.05s; }
  .anim-in.play > *:nth-child(2) { animation-delay: 0.18s; }
  .anim-in.play > *:nth-child(3) { animation-delay: 0.32s; }
  .anim-in.play > *:nth-child(4) { animation-delay: 0.46s; }
  @keyframes elemIn {
    0%   { opacity: 0; transform: translateY(38px) scale(0.9); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  .announce.play { animation: announceIn 0.55s cubic-bezier(0.22, 1, 0.36, 1); }
  @keyframes announceIn {
    0% { opacity: 0; transform: scale(0.85); }
    100% { opacity: 1; transform: scale(1); }
  }

  .glow-gold   { box-shadow: 0 0 0 6px rgba(255,210,74,0.15), 0 0 60px rgba(240,180,0,0.55); }
  .glow-silver { box-shadow: 0 0 0 6px rgba(228,232,236,0.15), 0 0 50px rgba(199,209,208,0.42); }
  .glow-bronze { box-shadow: 0 0 0 6px rgba(224,134,60,0.15), 0 0 50px rgba(224,134,60,0.45); }

  @media (max-width: 640px) {
    .eyebrow { letter-spacing: 0.25em; font-size: 10px; }
    #podium { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001s !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>

  <div class="eyebrow">WIBO RETREAT 2026 · HACKATHON <b>AI</b></div>

  <div class="controls">
    <button class="btn btn-ghost" id="btnMute" title="Audio on/off (M)">🔊 Audio</button>
    <button class="btn btn-ghost" id="btnFull" title="Schermo intero (F)">⛶ Fullscreen</button>
    <button class="btn btn-ghost hidden" id="btnRestart" title="Ricomincia (R)">↺ Ricomincia</button>
  </div>

  <!-- ===================== SETUP ===================== -->

          '<div class="loser-challenge">' + t.challenge + '</div>' +
          '<div class="loser-members">' + membersHtml + '</div>' +
          '<div class="loser-quip">' + LOSER_QUIPS[pos] + '</div>' +
        '</div>';
      requestAnimationFrame(() => $('#loserCard').classList.add('play'));
      sadConfetti();
      wompSound();
      setTimeout(() => { busy = false; showPrompt(); }, 550);
    }

    function renderAnnounce(pos) {
      hidePrompt();
      const cls = MEDAL_CLASS[pos];
      stageInner.innerHTML =
        '<div class="announce" id="announceBox">' +
          '<div class="medal-ring glow-' + cls + '" style="background:' + medalBg(pos) + '">' + medalGlyph(pos) + '</div>' +
          '<div class="rank-sub">sta per arrivare il</div>' +
          '<div class="rank-label">' + ORD[pos] + ' CLASSIFICATO</div>' +
        '</div>';
      requestAnimationFrame(() => $('#announceBox').classList.add('play'));
      showPrompt();
    }

    function renderReveal(pos) {
      hidePrompt();
      busy = true;
      const t = winners[pos];
      const isFirst = pos === 1;
      const cls = MEDAL_CLASS[pos];
      const crown = isFirst ? '<div class="crown">👑</div>' : '';
      const membersHtml = t.members
        .map((m) => '<div class="member"><span class="dot"></span>' + m + '</div>')
        .join('');

      stageInner.innerHTML =
        '<div class="reveal-card ' + (isFirst ? 'first' : '') + ' anim-in" id="revealCard">' +
          '<div class="reveal-medal medal-' + cls + ' glow-' + cls + '">' +
            crown +
            '<span class="pos-num">' + pos + '<span class="pos-deg">°</span></span>' +
          '</div>' +
          '<div class="reveal-table">' + t.name + ' · ' + ORD_WORD[pos] + ' CLASSIFICATO</div>' +
          '<div class="reveal-challenge">' + t.challenge + '</div>' +
          '<div class="reveal-members">' + membersHtml + '</div>' +
        '</div>';

      requestAnimationFrame(() => $('#revealCard').classList.add('play'));

      if (isFirst) firstPlaceConfetti();
      else standardConfetti(pos);
      fanfareSound(pos);

      updatePodium(pos, t);

      // Svanisce la vignette viola della suspense (per tutte le posizioni)
      darkVeil.style.transition = 'opacity 1.1s ease';
      darkVeil.style.opacity = 0;

      const releaseAfter = isFirst ? 900 : 650;
      setTimeout(() => {
        busy = false;
        showPrompt();
      }, releaseAfter);
    }

    function renderSuspense(pos, phase) {
      hidePrompt();
      busy = true;
      const cfg = SUSPENSE[phase][pos];
      const cls = MEDAL_CLASS[pos];
      stageInner.innerHTML =
        '<div class="drumroll" id="drumBox">' +
          '<div class="dr-text ' + (cfg.shake ? 'dr-strong' : 'dr-soft') + '">' + cfg.text + '</div>' +
          '<div class="dr-dots ' + cls + '"><span></span><span></span><span></span><span></span></div>' +
        '</div>';

      darkVeil.style.transition = 'opacity ' + (cfg.dur / 1000) + 's ease';
      requestAnimationFrame(() => { darkVeil.style.opacity = cfg.veil; });
      drumrollSound(cfg.dur / 1000, pos === 1);

      let teaser = null;
      if (cfg.teaser) {
        let bursts = 0;
        teaser = setInterval(() => {
          fire({
            particleCount: 8, startVelocity: 22, spread: 60, ticks: 60,
            origin: { x: Math.random(), y: 1 },
            colors: ['#FFD24A', '#FFA109', '#6452D9'], scalar: 0.7,
          });
          if (++bursts > 12) clearInterval(teaser);
        }, 260);
      }

      setTimeout(() => {
        if (teaser) clearInterval(teaser);
        busy = false;
        advance();
      }, cfg.dur);
    }

    function renderPrize(pos) {
      hidePrompt();
      busy = true;
      const t = winners[pos];
      const p = PRIZES[pos];
      const isFirst = pos === 1;

      darkVeil.style.transition = 'opacity 1s ease';
      darkVeil.style.opacity = 0;

      const detailHtml = p.detail ? '<div class="prize-detail">' + p.detail + '</div>' : '';
      stageInner.innerHTML =
        '<div class="prize-card ' + (isFirst ? 'first' : '') + ' anim-in" id="prizeCard">' +
          '<div class="prize-eyebrow">' + t.name + ' · ' + ORD[pos] + ' classificato</div>' +
          '<div class="prize-icon">' + p.icon + '</div>' +
          '<div class="prize-label">Il premio</div>' +
          '<div class="prize-title ' + (isFirst ? 'gold-text' : '') + '">' + p.title + '</div>' +
          detailHtml +
        '</div>';

      requestAnimationFrame(() => $('#prizeCard').classList.add('play'));

      if (isFirst) firstPlaceConfetti();
      else standardConfetti(pos);
      sparkleSound(isFirst);

      const releaseAfter = isFirst ? 850 : 600;
      setTimeout(() => { busy = false; showPrompt(); }, releaseAfter);
    }

    function renderDone() {
      hidePrompt();
      stageInner.innerHTML = '';        // svuota la card del premio: niente sovrapposizioni
      darkVeil.style.transition = 'opacity 0.8s ease';
      darkVeil.style.opacity = 0;
      finale.classList.add('show');
      grandFinaleConfetti();
      ambientStop();
      finaleSound();
    }

    function updatePodium(pos, t) {
      $('#pod-name-' + pos).textContent = t.name;
      const col = document.querySelector('.podium-col[data-pos="' + pos + '"]');
      if (col) col.classList.add('show');
    }

    function initAudio() {
      if (!audioCtx) {
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          master = audioCtx.createGain();
          master.gain.value = muted ? 0 : 1;
          master.connect(audioCtx.destination);
        } catch (e) { audioCtx = null; }
      }
      // decodifica una volta sola il rullo di tamburi (mp3 incorporato)
      if (audioCtx && !drumBuffer && DRUM_B64 && DRUM_B64.length > 100) {
        try {
          const bin = atob(DRUM_B64);
          const bytes = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          audioCtx.decodeAudioData(bytes.buffer, function (b) { drumBuffer = b; }, function () {});
        } catch (e) {}
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }

    // Ferma il rullo con un breve fade (evita il click) al cambio scena
    function stopDrum() {
      if (!currentDrum) return;
      try {
        const t = T();
        currentDrum.g.gain.cancelScheduledValues(t);
        currentDrum.g.gain.setValueAtTime(currentDrum.g.gain.value, t);
        currentDrum.g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
        currentDrum.src.stop(t + 0.12);
      } catch (e) {}
      currentDrum = null;
    }
    function aOK() { return audioCtx && master && !muted; }
    function T() { return audioCtx.currentTime; }

    // Nota sintetizzata con inviluppo ADSR semplice
    function tone(freq, t0, dur, opts) {
      if (!aOK()) return;
      opts = opts || {};
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = opts.type || 'sine';
      o.frequency.setValueAtTime(freq, t0);
      if (opts.glideTo) o.frequency.exponentialRampToValueAtTime(opts.glideTo, t0 + dur);
      const peak = opts.peak != null ? opts.peak : 0.18;
      const atk = opts.attack != null ? opts.attack : 0.012;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(peak, t0 + atk);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      let node = o;
      if (opts.filter) {
        const f = audioCtx.createBiquadFilter();
        f.type = 'lowpass'; f.frequency.value = opts.filter;
        o.connect(f); f.connect(g);
      } else { o.connect(g); }
      g.connect(master);
      o.start(t0); o.stop(t0 + dur + 0.05);
    }
    function chord(freqs, t0, dur, opts) { freqs.forEach((f) => tone(f, t0, dur, opts)); }

    // Buffer di rumore breve riusato per ogni colpo di rullante
    let snareBuf = null;
    function getSnareBuf() {
      if (snareBuf) return snareBuf;
      const dur = 0.08;
      snareBuf = audioCtx.createBuffer(1, Math.ceil(audioCtx.sampleRate * dur), audioCtx.sampleRate);
      const d = snareBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
      return snareBuf;
    }
    // Un singolo colpo di rullante: rumore high-pass con decadimento rapido
    function snareHit(t0, amp) {
      const src = audioCtx.createBufferSource(); src.buffer = getSnareBuf();
      const hp = audioCtx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1400;
      const bp = audioCtx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2400; bp.Q.value = 0.6;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(amp, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.045);
      src.connect(hp); hp.connect(bp); bp.connect(g); g.connect(master);
      src.start(t0); src.stop(t0 + 0.08);
    }
    // Rullo di rullante: usa l'mp3 incorporato (tagliato al cambio scena); sintetizzato come fallback
    function drumrollSound(durSec, big) {
      if (!aOK()) return;
      stopDrum();
      if (drumBuffer) {
        try {
          const src = audioCtx.createBufferSource();
          src.buffer = drumBuffer;
          const g = audioCtx.createGain();
          g.gain.value = big ? 1.0 : 0.8;
          src.connect(g); g.connect(master);
          src.start();
          currentDrum = { src: src, g: g };
          return;
        } catch (e) {}
      }
      const t0 = T();
      const len = Math.max(0.4, durSec);
      const startInt = 0.06;                 // ~17 colpi/sec all'inizio
      const endInt = big ? 0.022 : 0.03;     // accelera a ~45/33 colpi/sec
      let t = t0;
      while (t < t0 + len) {
        const prog = (t - t0) / len;         // 0..1
        const amp = (big ? 0.10 : 0.075) * (0.35 + 0.65 * prog) * (0.85 + Math.random() * 0.3);
        snareHit(t, amp);
        t += startInt + (endInt - startInt) * prog;
      }
      // colpo finale secco a chiudere il rullo
      snareHit(t0 + len, big ? 0.16 : 0.12);
    }

    // Fanfara di rivelazione (piena per il 1°, breve per 2°/3°)
    function fanfareSound(pos) {
      if (!aOK()) return;
      const t = T();
      if (pos === 1) {
        // crash + arpeggio maggiore ascendente + accordo sostenuto
        noiseHit(t, 0.35, 0.18, 6000);
        const notes = [523.25, 659.25, 783.99, 1046.5]; // C5 E5 G5 C6
        notes.forEach((f, i) => tone(f, t + i * 0.11, 0.5, { type: 'triangle', peak: 0.2 }));
        chord([261.63, 329.63, 392.0, 523.25], t + 0.44, 1.4, { type: 'sawtooth', peak: 0.12, filter: 2200 });
        // brillantini
        [1568, 2093].forEach((f, i) => tone(f, t + 0.6 + i * 0.12, 0.4, { type: 'sine', peak: 0.08 }));
        // FESTA: folla che esulta + fuochi d'artificio
        cheerSound(t + 0.15, 2.2, 0.12);
        fireworkSound(t + 0.3);
        fireworkSound(t + 1.1);
      } else {
        noiseHit(t, 0.2, 0.12, 5000);
        const base = pos === 2 ? [523.25, 659.25, 783.99] : [493.88, 587.33, 739.99];
        base.forEach((f, i) => tone(f, t + i * 0.09, 0.4, { type: 'triangle', peak: 0.16 }));
        chord(base, t + 0.28, 0.8, { type: 'sine', peak: 0.09 });
        // applauso più contenuto per 2°/3°
        cheerSound(t + 0.1, 1.2, 0.07);
      }
    }

    // Colpo di rumore (crash/hi-hat)
    function noiseHit(t0, dur, peak, cutoff) {
      if (!aOK()) return;
      const buf = audioCtx.createBuffer(1, Math.ceil(audioCtx.sampleRate * dur), audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
      const src = audioCtx.createBufferSource(); src.buffer = buf;
      const hp = audioCtx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = cutoff || 4000;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(peak || 0.15, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      src.connect(hp); hp.connect(g); g.connect(master);
      src.start(t0); src.stop(t0 + dur);
    }

    // Burst di rumore generico (boom/crepitio/applauso) con inviluppo
    function noiseBurst(t0, dur, peak, kind, cutoff) {
      if (!aOK()) return;
      const buf = audioCtx.createBuffer(1, Math.ceil(audioCtx.sampleRate * dur), audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1);
      const src = audioCtx.createBufferSource(); src.buffer = buf;
      const f = audioCtx.createBiquadFilter();
      if (kind === 'low') { f.type = 'lowpass'; f.frequency.value = cutoff || 200; }
      else if (kind === 'high') { f.type = 'highpass'; f.frequency.value = cutoff || 3000; }
      else { f.type = 'bandpass'; f.frequency.value = cutoff || 2200; f.Q.value = 0.5; }
      const g = audioCtx.createGain();
      const atk = Math.min(0.03, dur * 0.25);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(peak, t0 + atk);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      src.connect(f); f.connect(g); g.connect(master);
      src.start(t0); src.stop(t0 + dur + 0.02);
    }

    // Folla che esulta / applausi: swell di rumore + applausi sparsi + "wooo"
    function cheerSound(t0, dur, peak) {
      if (!aOK()) return;
      // base: applauso sostenuto che gonfia e scende
      noiseBurst(t0, dur, peak, 'band', 2100);
      noiseBurst(t0, dur, peak * 0.7, 'high', 3500);
      // applausi/battimani sparsi
      const claps = Math.round(dur * 22);
      for (let i = 0; i < claps; i++) {
        noiseBurst(t0 + Math.random() * dur, 0.03, peak * (0.3 + Math.random() * 0.5), 'high', 3000);
      }
      // qualche "wooo" della folla (toni che salgono)
      const woos = peak > 0.1 ? 3 : 1;
      for (let i = 0; i < woos; i++) {
        const st = t0 + Math.random() * dur * 0.5;
        const base = 300 + Math.random() * 200;
        tone(base, st, 0.6, { type: 'sawtooth', peak: peak * 0.35, glideTo: base * 1.5, filter: 1200 });
      }
    }

    // Fuoco d'artificio: fischio che sale → boom → crepitio
    function fireworkSound(t0) {
      if (!aOK()) return;
      tone(500, t0, 0.42, { type: 'sine', peak: 0.05, glideTo: 1500 });       // fischio
      noiseBurst(t0 + 0.44, 0.28, 0.18, 'low', 170);                           // boom
      for (let i = 0; i < 9; i++) {                                            // crepitio
        noiseBurst(t0 + 0.46 + Math.random() * 0.45, 0.04, 0.04 + Math.random() * 0.06, 'high', 4500);
      }
    }

    // Premio: campanellini/sparkle
    function sparkleSound(big) {
      if (!aOK()) return;
      const t = T();
      const notes = big ? [784, 988, 1319, 1568, 2093] : [784, 1047, 1319];
      notes.forEach((f, i) => tone(f, t + i * 0.07, 0.5, { type: 'sine', peak: big ? 0.12 : 0.09 }));
    }

    // 4°/5°: "womp womp" trombone discendente (comico)
    function wompSound() {
      if (!aOK()) return;
      const t = T();
      const start = [233.08, 207.65, 185.0, 155.56]; // Bb3, Ab3, F#3, Eb3 discendenti
      start.forEach((f, i) => {
        tone(f, t + i * 0.42, 0.4, { type: 'sawtooth', peak: 0.14, glideTo: f * 0.86, filter: 1100 });
      });
    }

    // Finale trionfale
    function finaleSound() {
      if (!aOK()) return;
      const t = T();
      noiseHit(t, 0.5, 0.2, 5000);
      chord([261.63, 329.63, 392.0, 523.25, 659.25], t, 2.2, { type: 'sawtooth', peak: 0.13, filter: 2600 });
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, t + i * 0.12, 0.7, { type: 'triangle', peak: 0.16 }));
      // FESTA GRANDE: folla in delirio + raffica di fuochi d'artificio
      cheerSound(t + 0.1, 3.2, 0.14);
      [0.2, 0.9, 1.5, 2.2].forEach((off) => fireworkSound(t + off));
    }

    // Sottofondo ambient soffuso durante lo show
    function ambientStart() {
      if (!aOK() || ambientNodes) return;
      const t = T();
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.03, t + 2.5);
      const f = audioCtx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 700;
      const oscs = [130.81, 196.0, 261.63].map((freq, i) => {
        const o = audioCtx.createOscillator();
        o.type = 'sine'; o.frequency.value = freq;
        o.detune.value = i * 4 - 4;
        o.connect(g); o.start(t); return o;
      });
      g.connect(f); f.connect(master);
      ambientNodes = { g: g, oscs: oscs };
    }
    function ambientStop() {
      if (!ambientNodes) return;
      const t = audioCtx ? T() : 0;
      try {
        ambientNodes.g.gain.cancelScheduledValues(t);
        ambientNodes.g.gain.setTargetAtTime(0.0001, t, 0.4);
        ambientNodes.oscs.forEach((o) => o.stop(t + 1.2));
      } catch (e) {}
      ambientNodes = null;
    }

    function setMuted(m) {
      muted = m;
      if (master) master.gain.value = muted ? 0 : 1;
      btnMute.textContent = muted ? '🔇 Muto' : '🔊 Audio';
    }

    // ---------- Confetti (safe wrapper) ----------
    function fire(opts) {
      try { if (typeof window.confetti === 'function') window.confetti(opts); }
      catch (e) { /* no-op */ }
    }

    // Coriandoli "tristi" per 4°/5°: pochi, grigi, che cadono fiacchi 🤷
    function sadConfetti() {
      fire({ particleCount: 14, startVelocity: 12, spread: 45, gravity: 1.5, ticks: 110,
             origin: { y: 0.35 }, colors: ['#9DA8A7', '#C7D1D0', '#525959'], scalar: 0.8 });
    }

    function standardConfetti(pos) {
      const colors = pos === 2
        ? ['#9DA8A7', '#6452D9', '#A197E7', '#2BD988']
        : ['#E0863C', '#FFA109', '#6452D9', '#2BD988'];
      fire({ particleCount: 90, spread: 75, origin: { y: 0.6 }, colors, startVelocity: 42 });
      setTimeout(() => fire({ particleCount: 50, angle: 60, spread: 60, origin: { x: 0, y: 0.7 }, colors }), 120);
      setTimeout(() => fire({ particleCount: 50, angle: 120, spread: 60, origin: { x: 1, y: 0.7 }, colors }), 120);
    }

    function firstPlaceConfetti() {
      const colors = ['#FFD24A', '#F0B400', '#FFA109', '#6452D9', '#2BD988', '#A197E7'];
      fire({ particleCount: 220, spread: 100, origin: { y: 0.55 }, colors, startVelocity: 55, scalar: 1.1 });
      const cannon = (x, angle) => fire({ particleCount: 120, angle, spread: 70, origin: { x, y: 0.65 }, colors, startVelocity: 55 });
      setTimeout(() => cannon(0, 60), 80);
      setTimeout(() => cannon(1, 120), 80);
      let end = Date.now() + 2600;
      (function frame() {
        fire({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors });
        fire({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();
    }

    function grandFinaleConfetti() {
      const colors = ['#FFD24A', '#F0B400', '#FFA109', '#6452D9', '#2BD988', '#A197E7'];
      let end = Date.now() + 1800;
      (function frame() {
        fire({ particleCount: 4, angle: 60, spread: 55, origin: { x: 0, y: 0.7 }, colors, scalar: 0.9 });
        fire({ particleCount: 4, angle: 120, spread: 55, origin: { x: 1, y: 0.7 }, colors, scalar: 0.9 });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();
    }

    function showPrompt() { promptAdvance.classList.remove('hidden'); }
    function hidePrompt() { promptAdvance.classList.add('hidden'); }

    function restart() {
      winners = null;
      idx = -1;
      busy = false;
      ambientStop();
      stopDrum();
      stageInner.innerHTML = '';
      stage.classList.add('hidden');
      podium.classList.add('hidden');
      finale.classList.remove('show');
      btnRestart.classList.add('hidden');
      darkVeil.style.opacity = 0;
      setup.classList.remove('hidden');
      validateSelection();
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        (document.documentElement.requestFullscreen || function(){}).call(document.documentElement);
      } else {
        (document.exitFullscreen || function(){}).call(document);
      }
    }

    function onAdvanceInput() {
      if (setup.classList.contains('hidden') === false) return;
      if (busy) return;
      const step = steps[idx];
      if (!step || step.type === 'done') return;
      advance();
    }

    document.addEventListener('keydown', (e) => {
      const key = e.key;
      const inSetup = !setup.classList.contains('hidden');
      if (key === ' ' || key === 'Spacebar' || e.code === 'Space') {
        if (inSetup) return;
        e.preventDefault();
        onAdvanceInput();
      } else if (key === 'Enter' && inSetup) {
        const active = document.activeElement;
        if (!active || active.tagName !== 'SELECT') { e.preventDefault(); startShow(); }
      } else if (key === 'r' || key === 'R') {
        if (!inSetup) { e.preventDefault(); restart(); }
      } else if (key === 'f' || key === 'F') {
        e.preventDefault();
        toggleFullscreen();
      } else if (key === 'm' || key === 'M') {
        e.preventDefault();
        setMuted(!muted);
      }
    });

    stage.addEventListener('click', (e) => {
      if (e.target.closest('.controls')) return;
      onAdvanceInput();
    });

    btnStart.addEventListener('click', startShow);
    btnRestart.addEventListener('click', restart);
    btnFull.addEventListener('click', toggleFullscreen);
    btnMute.addEventListener('click', () => { initAudio(); setMuted(!muted); });

    validateSelection();
  })();
  </script>
</body>
